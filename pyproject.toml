[project]
name = "devconfig-project"
version = "0.1.0"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [ "devconfig" ]

[dependency-groups]
dev = [ "pytest" ]

[tool.pytest.ini_options]
testpaths = [ "devconfig/tests" ]

[tool.uv]
package = false
python-downloads = "manual"

[tool.uv.workspace]
members = [ "devconfig" ]

[tool.uv.sources]
devconfig = { workspace = true }
